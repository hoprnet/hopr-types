[package]
name = "hopr-internal-types"
description = "Contains HOPR-specific types required internally by the HOPR node"

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = ["rayon"]
rayon = ["dep:rayon"]
serde = [
  "dep:serde",
  "dep:serde_bytes",
  "hopr-crypto-types/serde",
  "hopr-primitive-types/serde",
]
fixed-rng = ["hopr-crypto-random/fixed-rng", "hopr-crypto-types/fixed-rng"]

[dependencies]
aquamarine = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true }
hex-literal = { workspace = true }
multiaddr = { workspace = true }
num_enum = { workspace = true }
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
smart-default = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

hopr-crypto-random = { workspace = true }
hopr-crypto-types = { workspace = true }
hopr-primitive-types = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
bimap = { workspace = true }
lazy_static = { workspace = true }
mockall = { workspace = true }
parameterized = { workspace = true }
postcard = { workspace = true }
tokio = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

[package.metadata.cargo-shear]
ignored = ["serde_bytes"]
