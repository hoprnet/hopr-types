name: PR
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions:
  contents: read
concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-pr
  cancel-in-progress: true
jobs:
  validate-pr-title:
    name: Validate title
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            build
            chore
            docs
            style
            refactor
            perf
            test
            ci
            revert
          requireScope: false
          ignoreLabels: |
            bot
            ignore-semantic-pull-request
  label:
    name: Add labels
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
      - name: Add "external" label for forked PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "external"
          fi
  # Gate jobs through inputs on the reusable workflows, not with a caller-level
  # `if:`: an input-skipped inner job still reports its required check name as
  # skipped (green), a skipped caller job does not. Merge-queue runs always
  # run everything.
  changes:
    name: Detect changes
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      lockfile: ${{ github.event_name != 'pull_request' || steps.filter.outputs.lockfile == 'true' }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - "src/**"
              - "benches/**"
              - "build.rs"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".cargo/**"
              - "flake.nix"
              - "flake.lock"
              - "nix/**"
            lockfile:
              - "Cargo.toml"
              - "Cargo.lock"
  checks:
    name: Check
    needs: changes
    uses: hoprnet/hopr-workflows/.github/workflows/checks.yaml@1476429c0d8c5a6331c50a4655501125051cdbf4 # workflow-checks-v2
    with:
      source_branch: ${{ github.event.pull_request.head.sha || github.sha }}
      lint_command: "nix run -L .#check"
      audit_command: "nix run .#audit"
      deps: false
      # Format and pre-commit cover every file type and always run.
      lint: ${{ needs.changes.outputs.rust == 'true' }}
      audit: ${{ needs.changes.outputs.lockfile == 'true' }}
      runner_small: depot-ubuntu-24.04
      runner_large: depot-ubuntu-24.04-4
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  tests:
    name: Test
    needs: changes
    uses: hoprnet/hopr-workflows/.github/workflows/tests.yaml@2f28adfb7c34a9f18087d8646e190b6aafcd4b52 # workflow-tests-v6
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload in the coverage job
    with:
      source_branch: ${{ github.event.pull_request.head.sha || github.sha }}
      # Coverage runs the unit tests, so the plain test job is redundant.
      enable_unit_tests: false
      enable_unit_coverage: ${{ needs.changes.outputs.rust == 'true' }}
      unit_coverage_command: "nix run .#coverage"
      runner_unit: depot-ubuntu-24.04-4
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  build-library:
    name: Library ${{ matrix.architecture }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64-linux
            runner: depot-ubuntu-24.04-4
            required_label: ""
          - architecture: aarch64-linux
            runner: depot-ubuntu-24.04-arm-4
            required_label: "binary:aarch64-linux"
          - architecture: aarch64-darwin
            runner: depot-macos-15
            required_label: "binary:aarch64-darwin"
    uses: hoprnet/hopr-workflows/.github/workflows/build-library.yaml@bfdfd56e110ee356595faac1424b74906ed50ac9 # build-library-v3.3.2
    permissions:
      contents: read
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.head.sha || github.sha }}
      version_type: commit
      architecture: ${{ matrix.architecture }}
      package_name: hopr-types
      # Cached crane build; cargo release then skips the rebuild (--no-verify).
      build_command: "nix build -L .#lib-hopr-types-${{ matrix.architecture }}"
      runner: ${{ matrix.runner }}
      enabled: ${{ needs.changes.outputs.rust == 'true' && (matrix.required_label == '' || github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, matrix.required_label)) }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  semver-checks:
    name: Semver
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check semver
        uses: hoprnet/hopr-workflows/actions/nix-action@ff4c0b7afc400ee6cf217841dc576f8a1289bcc0 # nix-action-v1.2.1
        with:
          source_branch: ${{ github.event.pull_request.head.sha }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          command: "nix run -L .#semver-checks"
  benchmarks:
    name: Benchmarks
    needs: [changes, checks, tests, build-library]
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: hoprnet/hopr-workflows/.github/workflows/benchmarks.yaml@c06be87b06af5bfcc48d98ebe95787c994e2d2c0 # workflow-benchmark-v1
    with:
      source_branch: ${{ github.event.pull_request.head.ref }}
      runner: depot-ubuntu-24.04-4
      bencher_project: ${{ github.event.repository.name }}
      # Re-enabled to track the public-key benchmarks through the compact/expanded
      # `OffchainPublicKey` split (hopr-types#52), which is gated on them.
      should_build: true
      should_run: true
      build_command: "nix build -L .#bench-build"
      run_command: "nix run .#bench-run"
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      bencher_api_token: ${{ secrets.BENCHER_API_TOKEN }}
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
      ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
