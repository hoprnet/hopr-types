[workspace]
resolver = "2"

members = [
    "chain",
    "crypto",
    "internal",
    "lib",
    "primitive",
    "random"
]
default-members = ["lib"]

[workspace.package]
version = "1.1.0"
authors = ["HOPR Association <tech@hoprnet.org>"]
homepage = "https://hoprnet.org/"
repository = "https://github.com/hoprnet/hopr-types"
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
aes = "0.8.4"
anyhow = "1.0.102"
aquamarine = "0.6.0"
arrayvec = "0.7.6"
async-trait = "0.1.89"
auto_impl = "1.3.0"
bigdecimal = "0.4.10"
bimap = "0.6.3"
blake3 = { version = "1.8.3", features = ["traits-preview"] }
cfg-if = "1.0.4"
chacha20 = "0.9.1"
chrono = "0.4.44"
cipher = "0.4.4"
criterion = "0.8.2"
ctr = "0.9.2"
curve25519-dalek = { version = "4.1.3", features = ["rand_core"] }
digest = "0.10.7"
ed25519-dalek = { version = "2.2.0", features = ["hazmat", "batch"] }
float-cmp = "0.10.0"
futures = "0.3.32"
futures-time = "3.0.1"
generic-array = "1.3.5"
hex = "0.4.3"
hex-literal = "1.1.0"
hickory-resolver = "0.25.2"
indexmap = { version = "2.13.0", features = ["serde", "rayon"] }
insta = { version = "1.46.3", features = ["json", "yaml", "redactions"] }
k256 = { version = "0.13.4", features = [
    "arithmetic",
    "ecdh",
    "hash2curve",
    "serde",
] }
lazy_static = "1.5.0"
libp2p-identity = { version = "0.2.13", features = [
    "peerid",
    "ed25519",
    "rand",
] }
mimalloc = { version = "0.1.48", default-features = false, features = [
    "secure",
] }
mockall = "0.14.0"
multiaddr = "0.18.2"
num_enum = "0.7.5"
opentelemetry = { version = "0.31.0", features = ["metrics"] }
parameterized = "2.0.0" # ignored in renovate, kept back to 2.0.0 due to conflict with indexmap
poly1305 = "0.8.0"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
primitive-types = "0.14.0"
rand = "0.10.0"
rayon = "1.11.0"
regex = "1.12.3"
secp256k1 = { version = "0.31.1", default-features = false, features = [
  "alloc",
  "recovery",
  "std",
  "global-context",
] }
serde = "1.0.228"
serde_bytes = "0.11.19"
serde_json = "1.0.149"
serde_with = "3.17.0"
serial_test = "3.4.0"
sha2 = "0.10.9"
sha3 = "0.10.8"
smart-default = "0.7.1"
strum = { version = "0.28.0", features = ["derive"] }
subtle = "2.6.1"
test-log = { version = "0.2.19", features = ["trace"] }
thiserror = "2.0.18"
tikv-jemalloc-ctl = { version = "0.6.1", features = ["stats"] }
tikv-jemallocator = "0.6.1"
tokio = { version = "1.50.0", features = [
    "rt-multi-thread",
    "macros",
    "tracing",
] }
tracing = { version = "0.1.44", features = ["release_max_level_debug"] }
typenum = "1.19.0"
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }

hopr-bindings = { git = "https://github.com/hoprnet/contracts", branch = "main", version = "4.7.0" }
hopr-chain-types = { path = "chain" }
hopr-crypto-random = { path = "random" }
hopr-crypto-types = { path = "crypto" }
hopr-internal-types = { path = "internal" }
hopr-primitive-types = { path = "primitive"}
hopr-types = { path = "lib" }
