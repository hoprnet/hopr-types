[package]
name = "hopr-types"
version = "1.6.0"
description = "Complete collection of Rust types used in Hoprnet and other related projects"
authors = ["HOPR Association <tech@hoprnet.org>"]
homepage = "https://hoprnet.org/"
repository = "https://github.com/hoprnet/hopr-types"
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.93"

[package.metadata.docs.rs]
all-features = true

[package.metadata.crane]
name = "hopr-types"

[features]
default = ["rayon"]

all-types = ["chain", "crypto", "internal", "primitive", "random"]

primitive = [
  "dep:bigdecimal",
  "dep:chrono",
  "dep:float-cmp",
  "dep:hex",
  "dep:lazy_static",
  "dep:primitive-types",
  "dep:regex",
  "dep:sha3",
  "dep:thiserror",
]
random = ["dep:generic-array", "dep:rand"]
crypto = [
  "primitive",
  "random",
  "dep:aes",
  "dep:blake3",
  "dep:chacha20",
  "dep:cipher",
  "dep:ctr",
  "dep:curve25519-dalek",
  "dep:digest",
  "dep:ed25519-dalek",
  "dep:k256",
  "dep:libp2p-identity",
  "dep:poly1305",
  "dep:secp256k1",
  "dep:sha2",
  "dep:subtle",
  "dep:typenum",
  "dep:zeroize",
  "generic-array/zeroize",
]
internal = [
  "crypto",
  "dep:aquamarine",
  "dep:async-trait",
  "dep:hex-literal",
  "dep:multiaddr",
  "dep:num_enum",
  "dep:smart-default",
  "dep:strum",
  "dep:tracing",
]
chain = ["internal", "dep:anyhow", "dep:serde", "dep:serde_with"]

serde = [
  "dep:serde",
  "dep:serde_bytes",
  "chrono/serde",
  "primitive-types/serde",
  "curve25519-dalek/serde",
  "ed25519-dalek/serde",
  "generic-array/serde",
  "k256/serde",
  "libp2p-identity/serde",
]
fixed-rng = ["random", "dep:lazy_static"]
rayon = ["internal", "dep:rayon"]
use-bindings = ["chain", "dep:hopr-bindings"]
rust-ecdsa = ["crypto"]

[dependencies]
aes = { version = "0.8.4", optional = true }
anyhow = { version = "1.0.102", optional = true }
aquamarine = { version = "0.6.0", optional = true }
async-trait = { version = "0.1.89", optional = true }
bigdecimal = { version = "0.4.10", optional = true }
blake3 = { version = "=1.8.3", optional = true, features = ["traits-preview"] }
chacha20 = { version = "0.9.1", optional = true }
chrono = { version = "0.4.44", optional = true }
cipher = { version = "0.4.4", optional = true }
ctr = { version = "0.9.2", optional = true }
curve25519-dalek = { version = "4.1.3", optional = true, features = [
  "rand_core",
] }
digest = { version = "0.10.7", optional = true }
ed25519-dalek = { version = "2.2.0", optional = true, features = [
  "hazmat",
  "batch",
] }
float-cmp = { version = "0.10.0", optional = true }
generic-array = { version = "1.3.5", optional = true }
hex = { version = "0.4.3", optional = true }
hex-literal = { version = "1.1.0", optional = true }
hopr-bindings = { version = "4.8.0", optional = true }
k256 = { version = "0.13.4", optional = true, features = [
  "arithmetic",
  "ecdh",
  "hash2curve",
] }
lazy_static = { version = "1.5.0", optional = true }
libp2p-identity = { version = "0.2.13", optional = true, features = [
  "peerid",
  "ed25519",
  "rand",
] }
multiaddr = { version = "0.18.2", optional = true }
num_enum = { version = "0.7.6", optional = true }
poly1305 = { version = "0.8.0", optional = true }
primitive-types = { version = "0.14.0", optional = true }
rand = { version = "0.10.0", optional = true, features = ["thread_rng"] }
rayon = { version = "1.11.0", optional = true }
regex = { version = "1.12.3", optional = true }
secp256k1 = { version = "0.31.1", optional = true, default-features = false, features = [
  "alloc",
  "recovery",
  "std",
  "global-context",
] }
serde = { version = "1.0.228", optional = true, features = ["derive"] }
serde_bytes = { version = "0.11.19", optional = true }
serde_with = { version = "3.18.0", optional = true }
sha2 = { version = "0.10.9", optional = true }
sha3 = { version = "0.10.8", optional = true }
smart-default = { version = "0.7.1", optional = true }
strum = { version = "0.28.0", optional = true, features = ["derive"] }
subtle = { version = "2.6.1", optional = true }
thiserror = { version = "2.0.18", optional = true }
tracing = { version = "0.1.44", optional = true, features = [
  "release_max_level_debug",
] }
typenum = { version = "1.19.0", optional = true }
zeroize = { version = "1.8.2", optional = true, features = ["zeroize_derive"] }

[dev-dependencies]
anyhow = "1.0.102"
bimap = "0.6.3"
criterion = "0.8.2"
hex = "0.4.3"
hex-literal = "1.1.0"
insta = { version = "1.46.3", features = ["json", "yaml", "redactions"] }
lazy_static = "1.5.0"
mockall = "0.14.0"
parameterized = "2.0.0"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = [
  "rt-multi-thread",
  "macros",
  "tracing",
] }

[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

[package.metadata.cargo-shear]
ignored = ["serde_bytes"]

[[bench]]
name = "hash_bench"
harness = false

[[bench]]
name = "lioness_bench"
harness = false

[[bench]]
name = "pubkey_bench"
harness = false

[[bench]]
name = "signature_bench"
harness = false

[[bench]]
name = "vrf_bench"
harness = false
