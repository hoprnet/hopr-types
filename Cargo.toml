[workspace]
resolver = "2"

members = [
    "async-runtime",
    "chain",
    "crypto",
    "internal",
    "lib",
    "metrics",
    "network",
    "parallelize",
    "primitive",
    "random"
]

[workspace.package]
rust-version = "1.91"
authors = ["HOPR Association <tech@hoprnet.org>"]
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
arrayvec = "0.7.6"
auto_impl = "1.3.0"
async-trait = "0.1.89"
aquamarine = "0.6.0"
bimap = "0.6.3"
bigdecimal = "0.4.10"
chrono = "0.4.44"
curve25519-dalek = { version = "4.1.3", features = ["rand_core"] }
cfg-if = "1.0.4"
criterion = "0.8.2"
float-cmp = "0.10.0"
futures = "0.3.32"
futures-time = "3.0.1"
flume = "0.12.0"
generic-array = "1.3.5"
hex = "0.4.3"
hex-literal = "1.1.0"
hickory-resolver = "0.25.2"
indexmap = { version = "2.13.0", features = ["serde", "rayon"] }
insta = { version = "1.46.3", features = ["json", "yaml", "redactions"] }
k256 = { version = "0.13.4", features = [
    "arithmetic",
    "ecdh",
    "hash2curve",
    "serde",
] }
lazy_static = "1.5.0"
libc = "0.2" # Intentionally unpinned to 0.2
libp2p-identity = "0.2.13"
mimalloc = { version = "0.1.48", default-features = false, features = [
    "secure",
] }
mockall = "0.14.0"
multiaddr = "0.18.2"
num_enum = "0.7.5"
parameterized = "2.1.0"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
primitive-types = "0.14.0"
prometheus = "0.14.0"
rand = "0.10.0"
rayon = "1.11.0"
regex = "1.12.3"
serde = "1.0.228"
serde_bytes = "0.11.19"
serde_json = "1.0.149"
serde_with = "3.17.0"
serial_test = "3.4.0"
sha3 = "0.10.8"
smart-default = "0.7.1"
subtle = "2.6.1"
strum = "0.28.0"
thiserror = "2.0.18"
tikv-jemallocator = "0.6.1"
tikv-jemalloc-ctl = { version = "0.6.1", features = ["stats"] }
tokio = { version = "1.49.0", features = [
    "rt-multi-thread",
    "macros",
    "tracing",
] }
tracing = { version = "0.1.44", features = ["release_max_level_debug"] }
typenum = "1.19.0"

hopr-bindings = { git = "https://github.com/hoprnet/contracts", branch = "main", version = "4.7.0" }

hopr-async-runtime = { path = "async-runtime"}
hopr-types = { path = "lib" }
hopr-parallelize = { path = "parallelize"}
hopr-primitive-types = { path = "primitive"}
hopr-internal-types = { path = "internal" }
hopr-crypto-random = { path = "random" }
hopr-crypto-types = { path = "crypto" }
hopr-chain-types = { path = "chain" }
hopr-network-types = { path = "network" }
hopr-metrics = { path = "metrics" }